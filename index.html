<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Med Stats &amp; Epi Trivia: Halloween Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Creepster&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%83%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --paper: #EEE9F3;
    --surface: #FFFFFF;
    --ink: #221A2C;
    --muted: #5E5470;
    --rule: #D3CADD;
    --pumpkin: #B85A00;
    --glow: rgba(242, 140, 40, 0.20);
    --card-glow: rgba(184, 90, 0, 0.22);
    --web: rgba(34, 26, 44, 0.16);
    --good: #2E7D32;
    --good-tint: #DDEFD9;
    --bad: #B3261E;
    --bad-tint: #F6DCD9;
    --on-accent: #FFFFFF;
    --title: "Creepster", "Chiller", "Papyrus", fantasy;
    --serif: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #15101C;
      --surface: #211A2B;
      --ink: #F1E9DA;
      --muted: #B6AAC4;
      --rule: #3A2F48;
      --pumpkin: #FF9A3C;
      --glow: rgba(255, 154, 60, 0.16);
      --card-glow: rgba(255, 154, 60, 0.30);
      --web: rgba(241, 233, 218, 0.14);
      --good: #8FD694;
      --good-tint: #1E3323;
      --bad: #FF7A70;
      --bad-tint: #3D1C1F;
      --on-accent: #15101C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #15101C;
    --surface: #211A2B;
    --ink: #F1E9DA;
    --muted: #B6AAC4;
    --rule: #3A2F48;
    --pumpkin: #FF9A3C;
    --glow: rgba(255, 154, 60, 0.16);
    --card-glow: rgba(255, 154, 60, 0.30);
    --web: rgba(241, 233, 218, 0.14);
    --good: #8FD694;
    --good-tint: #1E3323;
    --bad: #FF7A70;
    --bad-tint: #3D1C1F;
    --on-accent: #15101C;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background:
      radial-gradient(ellipse at 85% -10%, var(--glow), transparent 55%),
      var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-text-size-adjust: 100%;
  }

  :focus-visible { outline: 3px solid var(--pumpkin); outline-offset: 2px; }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* Corner cobweb */
  .web {
    position: absolute;
    top: env(safe-area-inset-top, 0px);
    right: 0;
    width: 210px;
    height: 210px;
    pointer-events: none;
    z-index: 0;
    background:
      repeating-conic-gradient(from 180deg at 100% 0%, var(--web) 0deg 0.7deg, transparent 0.7deg 15deg),
      repeating-radial-gradient(circle at 100% 0%, transparent 0 30px, var(--web) 30px 31.5px);
    -webkit-mask-image: radial-gradient(circle at 100% 0%, #000 0 58%, transparent 72%);
    mask-image: radial-gradient(circle at 100% 0%, #000 0 58%, transparent 72%);
  }
  @media (max-width: 480px) {
    .web { width: 150px; height: 150px; }
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 1.6rem 1.1rem 3rem;
  }

  h1 {
    margin: 0;
    font-family: var(--title);
    font-weight: 400;
    font-size: clamp(2.1rem, 9vw, 2.7rem);
    line-height: 1.05;
    letter-spacing: 0.02em;
    color: var(--pumpkin);
  }
  .edition {
    margin: 0.3rem 0 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.15rem;
    color: var(--muted);
  }
  .intro {
    margin: 0.75rem 0 1.25rem;
    color: var(--muted);
    font-size: 1.02rem;
    line-height: 1.45;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 1.35rem 1.15rem 1.5rem;
    box-shadow: 0 14px 40px -22px var(--card-glow);
  }
  @media (min-width: 560px) {
    .card { padding: 2rem; }
  }

  .prompt {
    margin: 0 0 1.25rem;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(1.3rem, 5vw, 1.65rem);
    line-height: 1.42;
    text-wrap: pretty;
  }

  .options { display: grid; gap: 0.6rem; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    width: 100%;
    min-height: 52px;
    text-align: left;
    font: 400 1.08rem/1.45 var(--sans);
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.8rem 0.95rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .opt:hover:not(:disabled) { border-color: var(--pumpkin); background: var(--paper); }
  .opt:active:not(:disabled) { background: var(--paper); }
  .opt:disabled { cursor: default; }
  .opt-letter {
    flex: none;
    display: grid;
    place-items: center;
    width: 1.9rem;
    height: 1.9rem;
    border-radius: 50%;
    border: 1px solid var(--rule);
    font-weight: 700;
    font-size: 0.95rem;
  }
  .opt-text { padding-top: 0.15rem; }
  .opt.is-correct { background: var(--good-tint); border-color: var(--good); }
  .opt.is-correct .opt-letter { background: var(--good); border-color: var(--good); color: var(--on-accent); }
  .opt.is-wrong { background: var(--bad-tint); border-color: var(--bad); }
  .opt.is-wrong .opt-letter { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
  .opt.is-dim { color: var(--muted); }

  .feedback {
    margin-top: 1.4rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--rule);
  }
  .feedback.reveal { animation: rise 0.35s ease-out; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .verdict {
    margin: 0 0 0.5rem;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.45rem;
    line-height: 1.3;
  }
  .verdict:focus { outline: none; }
  .verdict.is-right { color: var(--good); }
  .verdict.is-wrong { color: var(--bad); }
  .explain {
    margin: 0;
    font-size: 1.06rem;
    line-height: 1.62;
  }
  .thanks {
    margin: 1.25rem 0 0;
    color: var(--muted);
    font-size: 1rem;
  }

  /* Bats for a right answer, a ghost for a wrong one */
  .fx {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 20;
  }
  .fx span {
    position: absolute;
    font-size: 2.1rem;
    line-height: 1;
    will-change: transform;
  }
  .fx .bat {
    left: -3rem;
    animation: fly 1.9s ease-in forwards;
  }
  @keyframes fly {
    0%   { transform: translate(0, 0) rotate(-8deg); }
    25%  { transform: translate(30vw, -3vh) rotate(6deg); }
    50%  { transform: translate(60vw, 2vh) rotate(-6deg); }
    75%  { transform: translate(90vw, -4vh) rotate(6deg); }
    100% { transform: translate(115vw, 0) rotate(-8deg); }
  }
  .fx .ghost {
    bottom: -4rem;
    left: 45vw;
    font-size: 3rem;
    animation: drift 2.3s ease-out forwards;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0); opacity: 0; }
    15%  { opacity: 0.95; }
    100% { transform: translate(4vw, -78vh); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .feedback.reveal { animation: none; }
    .fx { display: none; }
  }

  /* Three-question progress */
  .steps {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.4fr);
    gap: 8px;
    list-style: none;
    margin: 0 0 1rem;
    padding: 0;
  }
  .steps button {
    position: relative;
    width: 100%;
    min-height: 46px;
    font: 700 1.05rem/1 var(--sans);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .steps button:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
  .steps button::after {
    content: "";
    position: absolute;
    left: 30%;
    right: 30%;
    bottom: 5px;
    height: 4px;
    border-radius: 2px;
    background: transparent;
  }
  .steps button.is-right { background: var(--good-tint); border-color: var(--good); }
  .steps button.is-right::after { background: var(--good); }
  .steps button.is-wrong { background: var(--bad-tint); border-color: var(--bad); }
  .steps button.is-wrong::after {
    background: repeating-linear-gradient(90deg, var(--bad) 0 4px, transparent 4px 7px);
  }
  .steps button[aria-current="step"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .prompt:focus { outline: none; }

  .btn-primary {
    min-height: 48px;
    margin-top: 1.25rem;
    padding: 0.8rem 1.25rem;
    font: 700 1.05rem/1 var(--sans);
    color: var(--on-accent);
    background: var(--pumpkin);
    border: 1px solid var(--pumpkin);
    border-radius: 8px;
    cursor: pointer;
  }

  .summary.reveal { animation: rise 0.4s ease-out; }
  .score-num {
    margin: 0;
    font-family: var(--title);
    font-weight: 400;
    font-size: clamp(3.4rem, 18vw, 4.8rem);
    line-height: 1;
    color: var(--pumpkin);
  }
  .score-msg {
    margin: 0.6rem 0 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.5rem;
    line-height: 1.3;
  }
  .score-msg:focus { outline: none; }
  .score-note {
    margin: 1rem 0 0;
    color: var(--muted);
    font-size: 1.02rem;
    line-height: 1.5;
  }
  @media (prefers-reduced-motion: reduce) {
    .summary.reveal { animation: none; }
  }
</style>
</head>
<body>
  <div class="web" aria-hidden="true"></div>
  <main>
    <h1>Med Stats &amp; Epi Trivia</h1>
    <p class="edition">Halloween edition</p>
    <p class="intro" id="intro">Trick or treat? Here are three questions from the history of medical statistics. Tap an answer to see how you did.</p>

    <nav aria-label="Your questions">
      <ol class="steps" id="steps"></ol>
    </nav>

    <article class="card" id="qcard">
      <h2 class="prompt" id="prompt-heading" tabindex="-1"><span class="sr" id="sr-count"></span><span id="prompt"></span></h2>
      <div class="options" id="options" role="group" aria-label="Answer choices"></div>
      <div class="feedback" id="feedback" aria-live="polite" hidden>
        <p class="verdict" id="verdict" tabindex="-1"></p>
        <p class="explain" id="explain"></p>
        <button class="btn-primary" id="next" type="button">Next question</button>
      </div>
    </article>

    <article class="card summary" id="summary" hidden>
      <h2 class="sr">Your score</h2>
      <p class="score-num" id="score-num"></p>
      <p class="score-msg" id="score-msg" tabindex="-1"></p>
      <p class="score-note">Tap 1, 2, or 3 above to look back at your answers.</p>
      <p class="thanks">Thanks for playing, and happy Halloween!</p>
    </article>
  </main>
  <div class="fx" id="fx" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  var QUESTIONS = [
    {
      prompt: "ROC curves are now the standard way to judge how well a diagnostic test separates sick from healthy patients. Where does the name “receiver operating characteristic” come from?",
      options: [
        { id: "a", text: "Early cardiac monitors in coronary care units" },
        { id: "b", text: "Radar operators detecting enemy aircraft in World War II" },
        { id: "c", text: "Telegraph receivers on transatlantic cables" },
        { id: "d", text: "Hearing tests developed for military recruits" }
      ],
      correct: "b",
      right: "Right on the radar!",
      wrong: "That one flew under the radar.",
      explanation: "Signal detection theory was developed to describe how well radar receiver operators distinguished real aircraft from noise, trading off hits against false alarms. The same logic later spread to psychology and then radiology. Today, every AUC you read in a diagnostic accuracy paper is answering the radar operator’s question: how often does the signal beat the noise?"
    },
    {
      prompt: "Kaplan and Meier’s 1958 survival analysis paper is one of the most cited statistics papers ever written. How did the two end up as co-authors?",
      options: [
        { id: "a", text: "They were college roommates who started the project as a bet" },
        { id: "b", text: "Each submitted a separate, similar manuscript, and the journal editor persuaded them to merge" },
        { id: "c", text: "Meier was Kaplan’s doctoral advisor" },
        { id: "d", text: "They were both statisticians on the Framingham Heart Study" }
      ],
      correct: "b",
      right: "You survived that one!",
      wrong: "Censored, try again.",
      explanation: "Kaplan and Meier independently submitted papers on estimating survival with incomplete follow-up. The editor, John Tukey, suggested they combine them, which reportedly took years of correspondence to reconcile. Their product-limit estimator solved the problem of censoring, patients who leave a study or haven’t had the event yet, and it’s behind nearly every survival curve in oncology and cardiology trials."
    },
    {
      prompt: "The 1948 streptomycin trial for tuberculosis is often called the first true randomized controlled trial. How did investigators justify randomly withholding the new drug from the control group?",
      options: [
        { id: "a", text: "Streptomycin was considered too toxic to give to everyone" },
        { id: "b", text: "There wasn’t enough streptomycin to treat all eligible patients, so random allocation was the fairest way to share it" },
        { id: "c", text: "All patients signed detailed consent forms agreeing they might not receive the drug" },
        { id: "d", text: "Earlier studies had already suggested streptomycin didn’t work for tuberculosis" }
      ],
      correct: "b",
      right: "Randomly brilliant!",
      wrong: "Allocation error!",
      explanation: "The 1948 Medical Research Council trial of streptomycin for pulmonary tuberculosis, designed by Austin Bradford Hill, is widely regarded as the first properly randomized controlled trial, with allocation from random number sequences kept in sealed envelopes. Postwar Britain could afford only a small supply of the drug, so Hill argued a lottery was the fairest way to decide who got it. The twist: control patients weren’t told they were in a trial at all, while the radiologists reading their chest X-rays were blinded to treatment group."
    },
    {
      prompt: "Which landmark study is credited with introducing the term “risk factor” into medical vocabulary?",
      options: [
        { id: "a", text: "The British Doctors Study" },
        { id: "b", text: "The Nurses’ Health Study" },
        { id: "c", text: "The Seven Countries Study" },
        { id: "d", text: "The Framingham Heart Study" }
      ],
      correct: "d",
      right: "Low risk, high reward!",
      wrong: "Risky choice.",
      explanation: "Framingham enrolled about 5,200 adults in 1948 and followed them prospectively. A 1961 paper by Kannel and colleagues on “factors of risk” for coronary heart disease gave us the phrase, and the study helped establish hypertension, high cholesterol, and smoking as cardiovascular risk factors. It’s now following the grandchildren of the original cohort."
    },
    {
      prompt: "In 1784, Benjamin Franklin and Antoine Lavoisier ran one of history’s earliest blinded experiments for a French royal commission. What were they testing?",
      options: [
        { id: "a", text: "Smallpox inoculation" },
        { id: "b", text: "Bloodletting for fever" },
        { id: "c", text: "Franz Mesmer’s “animal magnetism”" },
        { id: "d", text: "Electrical shock as a cure for paralysis" }
      ],
      correct: "c",
      right: "Mesmerizing work!",
      wrong: "Not quite, keep your eyes open.",
      explanation: "Blindfolded subjects had dramatic reactions only when they believed they were being “magnetized,” regardless of whether anything was actually done. The commission concluded the effects came from imagination, an early demonstration of the placebo effect and of why blinding matters. Bonus trivia: Joseph-Ignace Guillotin also sat on the commission."
    },
    {
      prompt: "Long before modern statistics, a physician might call an opinion “probable.” In medieval and Renaissance usage, what did that mean?",
      options: [
        { id: "a", text: "It was supported by counting how often outcomes occurred" },
        { id: "b", text: "It was approved by respected authorities, such as Galen or Aristotle" },
        { id: "c", text: "It was more likely true than false" },
        { id: "d", text: "It came from analyzing games of chance" }
      ],
      correct: "b",
      right: "Approved by the authorities!",
      wrong: "Improbable, in the old sense.",
      explanation: "Philosopher Ian Hacking argued that before the mid-1600s, probabilis meant worthy of approval, an opinion backed by respected authorities like Galen or Aristotle, not by evidence or frequencies. Meanwhile, physicians and other practitioners of the “low sciences” reasoned from signs: a pulse, a urine color, or a symptom that pointed to a disease most of the time but not always. Hacking’s thesis is that this sign-based reasoning helped shift probability from the testimony of authorities to the evidence of things themselves, setting the stage for modern probability around 1660. Every likelihood ratio you calculate is a descendant of reading signs."
    },
    {
      prompt: "In 1760, mathematician Daniel Bernoulli built what’s often called the first mathematical model in epidemiology. What was he arguing for?",
      options: [
        { id: "a", text: "Inoculating people against smallpox" },
        { id: "b", text: "Quarantining ships to prevent plague" },
        { id: "c", text: "Draining swamps to reduce malaria" },
        { id: "d", text: "Banning bloodletting in children" }
      ],
      correct: "a",
      right: "Well inoculated!",
      wrong: "Not quite, try a different shot.",
      explanation: "Bernoulli modeled smallpox deaths by age and estimated that universal variolation, despite its small risk of killing the patient, would raise life expectancy at birth by about three years. Jean d’Alembert pushed back, asking how anyone should weigh a small immediate risk of death against a long-term gain. That’s essentially the same risk–benefit debate that surrounds vaccines and preventive therapies today."
    },
    {
      prompt: "The Bernoulli name turns up all over probability and statistics, from the “Bernoulli trial” to the Bernoulli distribution. Across three generations, how many members of the Bernoulli family of Basel, Switzerland, became notable mathematicians?",
      options: [
        { id: "a", text: "Two" },
        { id: "b", text: "Four" },
        { id: "c", text: "Eight" },
        { id: "d", text: "Twelve" }
      ],
      correct: "c",
      right: "Bernoulli-ant!",
      wrong: "The law of large numbers says keep trying.",
      explanation: "Eight Bernoullis became notable mathematicians, and three left lasting marks on probability. Jacob’s Ars Conjectandi, published after his death in 1713, proved the first law of large numbers, the reason bigger trials give more stable estimates; any yes/no outcome like survived or died is still called a “Bernoulli trial.” His nephew Nicolaus posed the St. Petersburg paradox, and Daniel resolved it in 1738 with the idea of expected utility, an ancestor of the utility weights used in medical decision analysis. The family was famously competitive: brothers Jacob and Johann feuded for years, and Johann reportedly backdated a book to claim priority over his own son Daniel. Bonus: Jacob asked for a logarithmic spiral on his tombstone, and the stonemason carved the wrong kind of spiral."
    },
    {
      prompt: "Why is it called “regression”? The term comes from Francis Galton’s 1880s observation about what?",
      options: [
        { id: "a", text: "Tumors shrinking after radiation treatment" },
        { id: "b", text: "Children of unusually tall parents tending to be closer to average height" },
        { id: "c", text: "Patients regressing to childlike behavior in asylums" },
        { id: "d", text: "Fevers returning after quinine was stopped" }
      ],
      correct: "b",
      right: "You’ve reached your full stature!",
      wrong: "Regress and try again.",
      explanation: "Galton found that children of very tall or very short parents tended to be closer to average height, which he called “regression towards mediocrity.” It wasn’t biology pulling toward the mean, just the statistical reality that extreme measurements are partly chance. In clinic, it’s why a patient enrolled for one very high blood pressure reading often looks better at follow-up, treatment or not."
    },
    {
      prompt: "Body mass index appears on nearly every patient chart. Who invented it in the 1830s?",
      options: [
        { id: "a", text: "A Victorian life insurance physician pricing policies" },
        { id: "b", text: "A Prussian army surgeon screening recruits" },
        { id: "c", text: "A Belgian astronomer and statistician searching for the “average man”" },
        { id: "d", text: "Ancel Keys, an American physiologist studying heart disease" }
      ],
      correct: "c",
      right: "A weighty answer!",
      wrong: "That doesn’t measure up.",
      explanation: "Quetelet, a Belgian astronomer turned social statistician, measured populations to describe the “average man” and noticed that adult weight scaled roughly with height squared. He never meant it as a diagnostic tool for individual patients. In 1972, physiologist Ancel Keys compared weight indices for population studies, found Quetelet’s worked best, and renamed it the “body mass index.” Its use for judging individual health is still debated today."
    }
  ];

  var N = QUESTIONS.length;
  var PICK = 3;
  var KEY = "medstats-trivia-halloween-3q-v1";
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function $(id) { return document.getElementById(id); }
  var introEl = $("intro"), stepsEl = $("steps"), qCard = $("qcard"), sumCard = $("summary"),
      headingEl = $("prompt-heading"), srCountEl = $("sr-count"), promptEl = $("prompt"),
      optsEl = $("options"), fbEl = $("feedback"), verdictEl = $("verdict"), explainEl = $("explain"),
      nextBtn = $("next"), scoreNumEl = $("score-num"), scoreMsgEl = $("score-msg");

  function randInt(max) {
    try {
      var buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] % max;
    } catch (e) {
      return Math.floor(Math.random() * max);
    }
  }

  function pickSet() {
    var pool = [];
    for (var i = 0; i < N; i++) pool.push(i);
    for (var j = pool.length - 1; j > 0; j--) {
      var k = randInt(j + 1);
      var tmp = pool[j]; pool[j] = pool[k]; pool[k] = tmp;
    }
    return pool.slice(0, PICK);
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      var ok = d && Array.isArray(d.indices) && Array.isArray(d.choices) &&
               d.indices.length === PICK && d.choices.length === PICK &&
               d.indices.every(function (n) { return typeof n === "number" && n >= 0 && n < N && Math.floor(n) === n; }) &&
               new Set(d.indices).size === PICK;
      if (ok) {
        return {
          indices: d.indices,
          choices: d.choices.map(function (c) { return typeof c === "string" ? c : null; })
        };
      }
    } catch (e) { /* storage unavailable or unreadable */ }
    return null;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(record)); } catch (e) { /* storage unavailable */ }
  }

  var record = load();
  if (!record) {
    record = { indices: pickSet(), choices: [null, null, null] };
    save();
  }

  function firstOpen() {
    for (var i = 0; i < PICK; i++) if (record.choices[i] === null) return i;
    return "summary";
  }
  function allDone() { return firstOpen() === "summary"; }
  function isRight(step) {
    return record.choices[step] === QUESTIONS[record.indices[step]].correct;
  }
  function scoreCount() {
    var c = 0;
    for (var i = 0; i < PICK; i++) if (record.choices[i] !== null && isRight(i)) c++;
    return c;
  }

  var view = firstOpen();

  function celebrate(kind) {
    var fxEl = document.getElementById("fx");
    if (reduceMotion || !fxEl) return;
    var count = kind === "ghost" ? 1 : (kind === "flock" ? 6 : 3);
    for (var i = 0; i < count; i++) {
      var el = document.createElement("span");
      el.textContent = kind === "ghost" ? "👻" : "🦇";
      el.className = kind === "ghost" ? "ghost" : "bat";
      if (kind !== "ghost") {
        el.style.top = (12 + (i % 3) * 13 + (i > 2 ? 6 : 0)) + "vh";
        el.style.animationDelay = (i * 0.16) + "s";
      }
      el.addEventListener("animationend", function (e) {
        if (e.target.parentNode) e.target.parentNode.removeChild(e.target);
      });
      fxEl.appendChild(el);
    }
  }

  function renderSteps() {
    while (stepsEl.firstChild) stepsEl.removeChild(stepsEl.firstChild);
    var open = firstOpen();
    for (var i = 0; i < PICK; i++) {
      (function (step) {
        var li = document.createElement("li");
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = String(step + 1);
        var answered = record.choices[step] !== null;
        var status = "";
        if (answered) {
          if (isRight(step)) { b.classList.add("is-right"); status = ", answered correctly"; }
          else { b.classList.add("is-wrong"); status = ", answered incorrectly"; }
        } else if (step !== open) {
          b.disabled = true;
          status = ", not yet unlocked";
        }
        if (view === step) b.setAttribute("aria-current", "step");
        b.setAttribute("aria-label", "Question " + (step + 1) + status);
        b.addEventListener("click", function () { go(step, false); });
        li.appendChild(b);
        stepsEl.appendChild(li);
      })(i);
    }
    var li2 = document.createElement("li");
    var sb = document.createElement("button");
    sb.type = "button";
    sb.textContent = "Score";
    sb.disabled = !allDone();
    sb.setAttribute("aria-label", allDone() ? "Your score" : "Your score, available after all three questions");
    if (view === "summary") sb.setAttribute("aria-current", "step");
    sb.addEventListener("click", function () { go("summary", false); });
    li2.appendChild(sb);
    stepsEl.appendChild(li2);
  }

  function renderQuestion(step, fresh) {
    var q = QUESTIONS[record.indices[step]];
    var choice = record.choices[step];
    var done = choice !== null;

    srCountEl.textContent = "Question " + (step + 1) + " of " + PICK + ". ";
    promptEl.textContent = q.prompt;

    while (optsEl.firstChild) optsEl.removeChild(optsEl.firstChild);
    q.options.forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      var letter = document.createElement("span");
      letter.className = "opt-letter";
      letter.setAttribute("aria-hidden", "true");
      letter.textContent = o.id.toUpperCase();
      var label = document.createElement("span");
      label.className = "sr";
      label.textContent = o.id.toUpperCase() + ". ";
      var text = document.createElement("span");
      text.className = "opt-text";
      text.textContent = o.text;
      b.appendChild(letter);
      b.appendChild(label);
      b.appendChild(text);
      if (done) {
        b.disabled = true;
        var note = document.createElement("span");
        note.className = "sr";
        if (o.id === q.correct) {
          b.classList.add("is-correct");
          note.textContent = " (correct answer)";
        } else if (o.id === choice) {
          b.classList.add("is-wrong");
          note.textContent = " (your answer)";
        } else {
          b.classList.add("is-dim");
        }
        b.appendChild(note);
      } else {
        b.addEventListener("click", function () { answer(step, o.id); });
      }
      optsEl.appendChild(b);
    });

    if (done) {
      var right = choice === q.correct;
      verdictEl.className = "verdict " + (right ? "is-right" : "is-wrong");
      verdictEl.textContent = right ? q.right : q.wrong;
      explainEl.textContent = q.explanation;
      nextBtn.textContent = allDone() ? "See your score" : "Next question";
      fbEl.hidden = false;
      fbEl.classList.remove("reveal");
      if (fresh && !reduceMotion) {
        void fbEl.offsetWidth;
        fbEl.classList.add("reveal");
      }
    } else {
      fbEl.hidden = true;
    }
  }

  function renderSummary(fresh) {
    var c = scoreCount();
    scoreNumEl.textContent = c + " of " + PICK;
    var msgs = [
      "The data were haunted this time.",
      "Not bad for a ghoul.",
      "Spooky good!",
      "A perfect score. All treats, no tricks!"
    ];
    scoreMsgEl.textContent = msgs[c];
    sumCard.classList.remove("reveal");
    if (fresh && !reduceMotion) {
      void sumCard.offsetWidth;
      sumCard.classList.add("reveal");
    }
  }

  function render(fresh) {
    introEl.textContent = allDone()
      ? "Here are your three Halloween questions from the history of medical statistics, with your answers."
      : "Trick or treat? Here are three questions from the history of medical statistics. Tap an answer to see how you did.";
    renderSteps();
    if (view === "summary") {
      qCard.hidden = true;
      sumCard.hidden = false;
      renderSummary(fresh);
    } else {
      sumCard.hidden = true;
      qCard.hidden = false;
      renderQuestion(view, fresh);
    }
  }

  function scrollTop() {
    if (window.scrollY > 0) {
      window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    }
  }

  function go(target, fresh) {
    view = target;
    render(fresh);
    scrollTop();
    try {
      if (target === "summary") scoreMsgEl.focus({ preventScroll: true });
      else headingEl.focus({ preventScroll: true });
    } catch (e) { /* older browsers */ }
    if (target === "summary" && fresh && scoreCount() === PICK) celebrate("flock");
  }

  function answer(step, id) {
    if (record.choices[step] !== null) return;
    record.choices[step] = id;
    save();
    render(true);
    celebrate(isRight(step) ? "bats" : "ghost");
    try { verdictEl.focus({ preventScroll: true }); } catch (e) { /* older browsers */ }
    fbEl.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  }

  nextBtn.addEventListener("click", function () {
    if (allDone()) go("summary", true);
    else go(firstOpen(), false);
  });

  render(false);
})();
</script>
</body>
</html>
